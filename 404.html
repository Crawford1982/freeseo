<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | MySiteAudit</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://mysiteaudit.co.uk/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0d0d0d; --paper: #f5f2eb; --accent: #e8451a;
      --muted: #8a8070; --border: #d4cfc4;
    }
    html { font-size: 16px; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: var(--ink); text-decoration: none; margin-bottom: 60px; display: inline-block; }
    .logo span { color: var(--accent); }
    .error-code { font-family: 'Syne', sans-serif; font-size: clamp(80px, 15vw, 140px); font-weight: 800; line-height: 1; color: var(--ink); letter-spacing: -4px; margin-bottom: 16px; }
    .error-code em { color: var(--accent); font-style: normal; }
    h1 { font-family: 'Syne', sans-serif; font-size: clamp(22px, 4vw, 32px); font-weight: 700; margin-bottom: 16px; }
    p { font-size: 17px; color: var(--muted); max-width: 440px; line-height: 1.6; margin-bottom: 40px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--ink); color: var(--paper);
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
      padding: 16px 32px; border-radius: 10px; text-decoration: none;
      transition: background 0.15s, transform 0.15s;
    }
    .btn:hover { background: var(--accent); transform: translateY(-2px); }
    .footer-note { margin-top: 60px; font-size: 13px; color: var(--muted); }
    .footer-note a { color: var(--muted); }
  </style>
</head>
<body>
  <a href="/" class="logo">My<span>Site</span>Audit</a>
  <div class="error-code">4<em>0</em>4</div>
  <h1>Page not found</h1>
  <p>This page doesn't exist — but your SEO audit does. Run a free check and find out exactly why your business isn't showing on Google.</p>
  <a href="/" class="btn">⚡ Run my free audit</a>
  <p class="footer-note">Or browse our <a href="/blog/">local SEO guides</a> · <a href="mailto:help@mysiteaudit.co.uk">Contact</a></p>
</body>
</html>
